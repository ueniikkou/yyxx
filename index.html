<script>
    // 1. 设置你的腾讯云后端 API 地址 (请将 YOUR_SERVER_IP 替换为你的真实公网 IP)
    const API_BASE = 'http://124.223.213.238:8080/api';

    // 内存中的全局数据变量
    let config = { user1: '加载中...', user2: '加载中...', startDate: '2024-01-01' };
    let wishes = [
        { id: 1, title: '一起看一次日出', done: false },
        { id: 2, title: '做一顿丰盛的大餐', done: true },
        { id: 3, title: '去一次迪士尼乐园', done: false },
        { id: 4, title: '看一场深夜电影', done: false },
        { id: 5, title: '一起拍一组搞怪情侣照', done: false }
    ];
    let diaries = [];

    // 从腾讯云 Go 后端拉取情侣配置数据
    async function loadConfigFromBackend() {
        try {
            const res = await fetch(`${API_BASE}/config`);
            const json = await res.json();
            if (json.code === 200 && json.data) {
                config = json.data;
                renderUI();
            }
        } catch (err) {
            console.error('连接后端失败，回退使用本地缓存:', err);
            // 访问失败时尝试回退到本地
            const local = localStorage.getItem('couple_config');
            if (local) config = JSON.parse(local);
            renderUI();
        }
    }

    // 将修改后的配置保存到腾讯云 Go 后端
    async function saveConfigToBackend(newConfig) {
        try {
            const res = await fetch(`${API_BASE}/config`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newConfig)
            });
            const json = await res.json();
            if (json.code === 200) {
                config = newConfig;
                localStorage.setItem('couple_config', JSON.stringify(config));
                renderUI();
                return true;
            }
        } catch (err) {
            alert('保存失败，请检查后端服务是否正常运行！');
            console.error(err);
        }
        return false;
    }

    // 渲染界面 UI
    function renderUI() {
        document.getElementById('user1-name').innerText = config.user1 || '男主角';
        document.getElementById('user2-name').innerText = config.user2 || '女主角';
        document.getElementById('start-date-display').innerText = `起始日：${config.startDate || '2024-01-01'}`;

        // 实时计算相爱天数
        const start = new Date(config.startDate || '2024-01-01');
        const today = new Date();
        const diffTime = Math.abs(today - start);
        const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
        document.getElementById('days-count').innerText = isNaN(diffDays) ? 0 : diffDays;

        renderWishes();
        renderDiaries();
    }

    function renderWishes() {
        const listEl = document.getElementById('wish-list');
        if (!listEl) return;
        listEl.innerHTML = '';
        let completed = 0;
        wishes.forEach(w => {
            if (w.done) completed++;
            const item = document.createElement('div');
            item.className = `flex items-center justify-between p-2.5 rounded-xl border text-xs cursor-pointer transition ${w.done ? 'bg-pink-50 border-pink-200 text-gray-400 line-through' : 'bg-white border-gray-100 text-gray-700'}`;
            item.onclick = () => toggleWish(w.id);
            item.innerHTML = `
                <span>${w.title}</span>
                <i class="${w.done ? 'fas fa-check-circle text-pink-500' : 'far fa-circle text-gray-300'}"></i>
            `;
            listEl.appendChild(item);
        });
        document.getElementById('wish-progress').innerText = `${completed}/${wishes.length} 完成`;
    }

    function toggleWish(id) {
        wishes = wishes.map(w => w.id === id ? { ...w, done: !w.done } : w);
        renderWishes();
    }

    function renderDiaries() {
        const listEl = document.getElementById('diary-list');
        if (!listEl) return;
        listEl.innerHTML = '';
        diaries.forEach(d => {
            const item = document.createElement('div');
            item.className = 'bg-white/70 p-3 rounded-2xl border border-pink-100 text-xs space-y-1';
            item.innerHTML = `
                <div class="text-pink-400 text-[10px]">${d.date}</div>
                <div class="text-gray-700">${d.content}</div>
            `;
            listEl.appendChild(item);
        });
    }

    function addDiary() {
        const input = document.getElementById('diary-input');
        const text = input.value.trim();
        if (!text) return;
        const newDiary = {
            id: Date.now(),
            date: new Date().toISOString().split('T')[0],
            content: text
        };
        diaries.unshift(newDiary);
        input.value = '';
        renderDiaries();
    }

    function sendAction(action) {
        const feed = document.getElementById('action-feed');
        feed.innerText = `你发送了一个【${action}】`;
        setTimeout(() => { feed.innerText = ''; }, 2500);
    }

    // 设置弹窗逻辑
    const modal = document.getElementById('settings-modal');
    document.getElementById('open-settings').onclick = () => {
        document.getElementById('input-user1').value = config.user1 || '';
        document.getElementById('input-user2').value = config.user2 || '';
        document.getElementById('input-start-date').value = config.startDate || '';
        modal.classList.remove('hidden');
    };
    document.getElementById('close-settings').onclick = () => modal.classList.add('hidden');
    
    document.getElementById('save-settings').onclick = async () => {
        const newConfig = {
            user1: document.getElementById('input-user1').value || '男主角',
            user2: document.getElementById('input-user2').value || '女主角',
            startDate: document.getElementById('input-start-date').value || '2024-01-01'
        };
        // 保存到 Go 后端
        const success = await saveConfigToBackend(newConfig);
        if (success) {
            modal.classList.add('hidden');
        }
    };

    // 页面载入时请求后端
    loadConfigFromBackend();
</script>
